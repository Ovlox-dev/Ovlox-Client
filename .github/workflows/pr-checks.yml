# Standalone Ovlox-Client repo — Next.js PR checks

name: Pull request checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Build output size (informational)
        run: |
          echo "📦 .next size:"
          du -sh .next/
          echo "📄 Top-level entries under .next:"
          find .next -maxdepth 2 -type d | head -n 30

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit (blocking)
        run: npm audit --production

      - name: Full audit (informational)
        run: npm audit || true

      - name: Outdated dependencies (informational)
        run: npm outdated || true
